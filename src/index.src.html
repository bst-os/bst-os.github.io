<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BST OS</title>
<meta name="description" content="Sistem kasir, dapur, stok, dan keuangan Bubur Simpang Tiga">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BST OS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
/* Layout: light work surface (reference: tablet POS). Top bar of white chips + pill navigation;
   kasir = menu grid of white cards on grey, Order Details panel fixed on the right with summary and Pay. */
:root{
  --bg:#ffffff; --card:#ffffff; --tile:#f6f6f4; --line:#ebeae6; --line-2:#dcdad4; --side:#fbfbfa;
  --text:#1c1c1e; --muted:#8a8984; --soft:#5b5a56;
  --pri:#1f1f1f; --on-pri:#ffffff;          /* charcoal actions */
  --brand:#284891; --brand-soft:#e7ecf7; --on-brand:#ffffff;  /* BST cobalt */
  --pay:#f4c062; --pay-deep:#e8ac3c; --on-pay:#3a2700;       /* kuning telur */
  --ok:#23824f; --ok-bg:#e3f3e9; --warn:#a86a0c; --warn-bg:#fbefd6; --bad:#d4483b; --bad-bg:#fde7e4;
  --font:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:12px; --r-sm:8px;
  --gut:max(16px, env(safe-area-inset-left, 0px)); --gutr:max(16px, env(safe-area-inset-right, 0px));
  --ink:var(--brand); --ink-soft:var(--brand-soft); --on-ink:var(--on-brand); --paper:var(--bg); --paper-2:var(--tile); --line-ink:var(--line-2);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--font);margin:0;text-wrap:balance;letter-spacing:-.015em;color:var(--text)}
h2{font-size:1.35rem;font-weight:700;line-height:1.2} h3{font-size:1rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:.6rem .75rem;width:100%;min-width:0;font-size:.93rem}
input:focus,select:focus,textarea:focus{border-color:var(--text);outline:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
label{display:grid;gap:.3rem;font-size:.78rem;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:var(--r-sm);padding:.55rem .95rem;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;font-size:.9rem}
.btn:hover{border-color:var(--line-2);background:var(--tile)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn.pri:hover{opacity:.9}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:.32rem .65rem;font-size:.8rem}
.btn.block{width:100%}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)} .small{font-size:.8rem}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.ink{color:var(--brand)}
.serif{font-weight:700}

/* ---------- top bar & navigation ---------- */
/* app shell: sidebar on tablet landscape & desktop, top bar + bottom tabs on phone/portrait */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(.9rem + env(safe-area-inset-top,0px)) .75rem calc(.9rem + env(safe-area-inset-bottom,0px)) max(.75rem, env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:.6rem;padding:.2rem .35rem 1rem}
.brand .tile{width:38px;height:38px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:0 0 auto}
.brand .tile svg{width:30px;height:auto;color:var(--on-brand)}
.brand div{display:grid;line-height:1.25;min-width:0}
.brand b{font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:inline-flex;align-items:center;gap:.35rem;font-size:.74rem;color:var(--ok);font-weight:600}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.navlist{overflow:auto;display:grid;align-content:start;gap:1rem}
.grp{display:grid;gap:2px}
.grp-t{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:0 .6rem .3rem}
.nav{display:flex;align-items:center;gap:.65rem;border:0;background:transparent;padding:.5rem .6rem;border-radius:8px;font-weight:500;cursor:pointer;color:var(--soft);white-space:nowrap;font-size:.88rem;width:100%;text-align:left}
.nav svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:var(--tile);color:var(--text)}
.nav[aria-current="page"]{background:var(--card);color:var(--text);font-weight:700;box-shadow:0 0 0 1px var(--line),0 1px 2px rgb(0 0 0 / .04)}
.nav[aria-current="page"] svg{color:var(--brand)}
.nav .cnt{margin-left:auto;background:var(--pay);color:var(--on-pay);border-radius:6px;font-size:.68rem;padding:0 .4rem;min-width:1.2rem;text-align:center;font-weight:800}
.me{display:flex;align-items:center;gap:.6rem;padding:.6rem;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;width:100%;text-align:left}
.me:hover{border-color:var(--line-2)}
.av{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:.76rem;font-weight:800;flex:0 0 auto}
.me div{display:grid;line-height:1.25;min-width:0}
.me b{font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .me small{color:var(--muted);font-size:.74rem}
.mainwrap{min-width:0;display:grid;grid-template-rows:auto 1fr}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;gap:.6rem;min-height:60px;padding:.55rem var(--gutr) .55rem var(--gut)}
.crumb{display:grid;line-height:1.2;min-width:0}
.crumb small{color:var(--muted);font-size:.74rem;font-weight:500}
.crumb b{font-size:1.02rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand{display:none;padding:0}
.top-right{margin-left:auto;display:flex;gap:.5rem;align-items:center}
.chip{display:inline-flex;align-items:center;gap:.5rem;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:.42rem .7rem;font-weight:500;font-size:.84rem;white-space:nowrap;color:var(--soft)}
.iconbtn{width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:9px}
.iconbtn svg{width:18px;height:18px}
.topuser{display:none;border:0;background:transparent;padding:0;cursor:pointer}
.bottom{display:none}
main{padding:1.25rem var(--gutr) 3rem var(--gut);min-width:0;overflow-x:clip}
@media (max-width:1099px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top .brand{display:flex}
  .crumb{display:none}
  .topuser{display:block}
  .bottom{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb, var(--bg) 94%, transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:.3rem max(.4rem, env(safe-area-inset-right,0px)) calc(.3rem + env(safe-area-inset-bottom,0px)) max(.4rem, env(safe-area-inset-left,0px))}
  .bottom button{border:0;background:transparent;display:grid;justify-items:center;gap:.15rem;padding:.4rem .2rem;font-size:.7rem;font-weight:600;color:var(--muted);cursor:pointer;border-radius:8px;position:relative}
  .bottom svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .bottom button[aria-current="page"]{color:var(--brand)}
  .bottom .cnt{position:absolute;top:.15rem;left:calc(50% + 6px);background:var(--pay);color:var(--on-pay);border-radius:6px;font-size:.62rem;padding:0 .3rem;font-weight:800}
  main{padding-bottom:calc(5.5rem + env(safe-area-inset-bottom,0px))}
}
@media (max-width:640px){ .datechip{display:none} }
.sheet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.sheet button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:.85rem .4rem;display:grid;justify-items:center;gap:.4rem;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text)}
.sheet button[aria-current="page"]{border-color:var(--brand);color:var(--brand)}
.sheet svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.view{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem;max-width:1400px;margin:0 auto}
.view > *,.grid2 > *,.stack > *,.pos > *,.panel > *{min-width:0}

/* ---------- blocks ---------- */
.head{display:flex;align-items:end;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.head > div{min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem}
.panel > h3{margin-bottom:.7rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end}
.row > *{flex:1 1 150px;min-width:0}
.row > .btn,.row > .fit{flex:0 0 auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:1rem;align-items:start}
.stack{display:grid;gap:.8rem}
.tbl{overflow-x:auto;margin:0 -.2rem}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:.55rem .55rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;white-space:nowrap}
.num{text-align:right!important;white-space:nowrap}
td input{padding:.4rem .5rem}
.pill{display:inline-block;padding:.1rem .5rem;border-radius:6px;font-size:.72rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.idle{background:var(--tile);color:var(--muted)} .pill.ink{background:var(--brand-soft);color:var(--brand)}
.empty{padding:1.4rem 1rem;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r);display:grid;gap:.5rem;justify-items:center}
.empty svg.emb{width:min(180px,60%);height:auto;color:var(--line-2)}
.rule{height:0;border-top:1px dashed var(--line-2);margin:.2rem 0}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:.75rem}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.85rem 1rem;display:grid;gap:.15rem;align-content:start}
.kpi b{font-weight:800;font-size:1.4rem;line-height:1.25;letter-spacing:-.02em}
.kpi .small{color:var(--muted)}
.kpi.lead{background:var(--brand);border-color:var(--brand)}
.kpi.lead b,.kpi.lead .eyebrow,.kpi.lead .small{color:var(--on-brand)}
.kpi.lead .eyebrow,.kpi.lead .small{opacity:.85}
.bars{display:flex;gap:4px;align-items:end;height:150px;padding-top:.5rem;overflow-x:auto;border-bottom:1px solid var(--line)}
.bar{flex:1 0 14px;background:var(--brand);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.bar.dim{background:var(--line)}
.bar:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:.72rem;padding:.2rem .45rem;border-radius:4px;white-space:nowrap;z-index:2}
.axis{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);padding-top:.3rem;gap:.5rem}
.hbar{display:grid;grid-template-columns:96px minmax(0,1fr) 150px;gap:.6rem;align-items:center;font-size:.85rem;padding:.25rem 0}
.hbar .num{text-align:right}
@media (max-width:520px){.hbar{grid-template-columns:80px minmax(0,1fr) 112px}}
.hbar .tr{height:8px;background:var(--tile);border-radius:99px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--brand);border-radius:99px}

/* home */
.tasks{display:grid;gap:.45rem}
.task{display:flex;align-items:center;gap:.75rem;padding:.65rem .75rem;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.task:hover{background:var(--tile)}
.task .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);flex:0 0 auto;display:grid;place-items:center}
.task.done .ck{background:var(--ok);border-color:var(--ok)}
.task.done .ck::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.task.done b{color:var(--muted)}
.task div{display:grid;min-width:0} .task b{font-weight:600} .task small{color:var(--muted)}
.task .go{margin-left:auto;color:var(--muted)}
.hello{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem;overflow:hidden}
.hello h2{font-size:1.45rem}
.hello p{color:var(--soft)}
.hello svg{width:min(200px,30vw);height:auto;color:var(--brand)}
@media (max-width:560px){.hello{grid-template-columns:1fr}.hello svg{display:none}}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,380px);grid-template-areas:"menu cart" "trx cart";grid-template-rows:auto 1fr;gap:1rem;align-items:start}
.pos .p-menu{grid-area:menu} .pos .cart{grid-area:cart} .pos .p-trx{grid-area:trx}
@media (max-width:860px){.pos{grid-template-columns:minmax(0,1fr);grid-template-areas:"menu" "cart" "trx"}.cart{position:static!important;max-height:none!important}}
.menu-head{display:flex;align-items:center;gap:.6rem;justify-content:space-between}
.menu-head h3{display:flex;align-items:center;gap:.45rem;font-size:1.02rem}
.menu-head h3 svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.search{position:relative;flex:0 1 240px}
.search input{padding-left:2.1rem;border-radius:10px}
.search svg{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8}
.cats{display:flex;gap:.4rem;flex-wrap:wrap}
.cat{border:1px solid transparent;background:transparent;border-radius:8px;padding:.3rem .55rem;font-size:.82rem;color:var(--soft);cursor:pointer;display:inline-flex;gap:.35rem;align-items:center;font-weight:500}
.cat span{background:var(--line);border-radius:5px;padding:0 .35rem;font-size:.72rem;font-weight:700;color:var(--soft)}
.cat[aria-pressed="true"]{background:var(--card);border-color:var(--line);color:var(--text);font-weight:700}
.cat[aria-pressed="true"] span{background:var(--pay);color:var(--on-pay)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:.7rem}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.4rem .4rem .6rem;display:grid;gap:.4rem;position:relative;cursor:pointer;text-align:left}
.mcard:hover{border-color:var(--line-2)}
.mcard .img{aspect-ratio:4/3;max-width:100%;background:var(--tile);border-radius:9px;display:grid;place-items:center;overflow:hidden;position:relative}
.mcard .img img{width:100%;height:100%;object-fit:cover}
.mcard .img svg{color:var(--brand)}
.mcard .stock{position:absolute;top:.45rem;left:.45rem}
.mcard .badge{position:absolute;top:.45rem;right:.45rem;background:var(--pri);color:var(--on-pri);border-radius:7px;min-width:24px;height:24px;padding:0 .35rem;display:grid;place-items:center;font-weight:800;font-size:.8rem}
.mcard .nm{font-weight:600;font-size:.9rem;padding:0 .3rem;line-height:1.3}
.mcard .ft{display:flex;align-items:center;justify-content:space-between;padding:0 .3rem}
.mcard .pr{font-weight:700;font-size:.92rem}
.mcard .add{width:30px;height:30px;border-radius:7px;background:var(--pri);color:var(--on-pri);display:grid;place-items:center;font-size:1.1rem;font-weight:600;line-height:1}
.mcard.out{opacity:.7}
.cart{position:sticky;top:80px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:.75rem;padding:.9rem;max-height:calc(100vh - 100px)}
.cart-head{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.cart-head h3{display:flex;gap:.4rem;align-items:center;margin-right:auto}
.cart-head h3 svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
.cart-head select{width:auto;padding:.38rem .6rem;font-size:.82rem;font-weight:600}
.lines{overflow:auto;display:grid;gap:.5rem;align-content:start;min-height:120px}
.cline{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:.6rem;align-items:center;border:1px solid var(--line);border-radius:10px;padding:.45rem}
.cline .th{width:56px;height:56px;border-radius:8px;background:var(--tile);display:grid;place-items:center;overflow:hidden}
.cline .th svg{color:var(--brand)} .cline .th img{width:100%;height:100%;object-fit:cover}
.cline .info{display:grid;gap:.15rem;min-width:0}
.cline .info b{font-weight:600;font-size:.88rem;line-height:1.25}
.cline .info .pr{font-weight:700}
.cline .cside{display:grid;justify-items:end;gap:.35rem}
.trash{width:28px;height:28px;border-radius:7px;border:0;background:var(--bad);color:#fff;display:grid;place-items:center;cursor:pointer}
.trash svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9}
.qty{display:flex;align-items:center;gap:.25rem}
.qty button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:1rem;cursor:pointer;line-height:1}
.qty b{min-width:1.4rem;text-align:center;font-size:.88rem}
.summary{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.summary .sr{display:flex;justify-content:space-between;padding:.45rem .75rem;font-size:.86rem}
.summary .sr.tot{border-top:1px solid var(--line);font-weight:700;font-size:.95rem;padding:.6rem .75rem}
.summary .sr.alt{background:var(--tile)}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.total strong{font-weight:800;font-size:1.25rem}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.25rem;background:var(--tile);padding:.25rem;border-radius:10px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:.45rem .7rem;border-radius:7px;font-weight:600;cursor:pointer;color:var(--soft);font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgb(0 0 0 / .08),inset 0 0 0 1px var(--line)}
.quick{display:flex;gap:.35rem;flex-wrap:wrap}
.quick .btn{flex:1 1 auto}
.pay{background:var(--pay)!important;border-color:var(--pay)!important;color:var(--on-pay)!important;padding:.85rem;font-size:1rem;font-weight:700;border-radius:10px}
.pay:hover{background:var(--pay-deep)!important}
.paybar{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}

/* prep flow */
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.35rem}
@media (max-width:640px){.flow{grid-template-columns:repeat(3,minmax(0,1fr))}}
.flow div{background:var(--tile);border-radius:8px;padding:.5rem .6rem;display:grid}
.flow span{font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.flow b{font-weight:800;font-size:1.25rem}
.flow .hl{background:var(--brand)} .flow .hl span,.flow .hl b{color:var(--on-brand)}

/* attendance */
.selfie{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.shot{aspect-ratio:3/4;max-width:100%;border:1px dashed var(--line-2);border-radius:var(--r);display:grid;place-items:center;overflow:hidden;background:var(--tile);color:var(--muted);text-align:center;padding:.5rem;font-size:.82rem}
.shot img{width:100%;height:100%;object-fit:cover}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.6rem}
.photos figure{margin:0;display:grid;gap:.25rem;font-size:.76rem}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--tile)}

/* login */
.auth{min-height:100%;display:grid;place-items:center;padding:2rem var(--gutr) 2rem var(--gut);background:var(--bg)}
.auth-card{width:min(100%,400px);display:grid;gap:1.2rem}
.auth-card .logo-full{width:min(260px,72%);height:auto;justify-self:center;color:var(--brand)}
.auth-card .panel{display:grid;gap:.85rem;padding:1.3rem}
.pin{letter-spacing:.45em;font-size:1.2rem;text-align:center}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .4);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:var(--card);border-radius:16px;padding:1.2rem;width:min(100%,460px);display:grid;gap:.9rem;max-height:calc(100vh - 32px);overflow:auto;border:1px solid var(--line);box-shadow:0 20px 50px rgb(0 0 0 / .18)}
.modal.wide{width:min(100%,720px)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pri);color:var(--on-pri);padding:.65rem 1rem;border-radius:10px;z-index:70;font-weight:600;max-width:calc(100% - 32px);text-align:center;font-size:.9rem}
.toast.err{background:var(--bad);color:#fff}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;background:var(--tile);border:1px dashed var(--line-2);padding:1rem;border-radius:8px;white-space:pre;overflow-x:auto}
.upd{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:65;background:var(--pri);color:var(--on-pri);border-radius:12px;padding:.6rem .7rem .6rem 1rem;display:flex;gap:.8rem;align-items:center;font-weight:600}
.upd .btn{background:var(--pay);color:var(--on-pay);border-color:var(--pay)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><g id="bst"><path fill="currentColor" fill-rule="evenodd" d="{{LOGO}}"/></g></defs>
</svg>

<div id="root"></div>
<div id="modalRoot"></div>

<script>
(() => {
"use strict";
const CFG = window.BST_CONFIG || {};
const SB = supabase.createClient(CFG.url, CFG.anonKey, {auth:{persistSession:true, storageKey:"bst-os-auth"}});
const EMAIL_DOMAIN = "bst-os.app";
const pinPass = p => "bst-" + p;
const TZ = "Asia/Makassar";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp = n => (Number(n) < 0 ? "−" : "") + "Rp" + Math.abs(Math.round(Number(n) || 0)).toLocaleString("id-ID");
const num = (n, d = 2) => (Number(n) || 0).toLocaleString("id-ID", {maximumFractionDigits: d});
const pn = v => { const s = String(v ?? "").trim(); if (!s) return 0; if (/^\d{1,3}(\.\d{3})+$/.test(s)) return Number(s.replace(/\./g, "")); return Number(s.replace(/\./g, "").replace(",", ".").replace(/[^\d.-]/g, "")) || 0; };
const pd = v => { let s = String(v ?? "").trim(); if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, ""); return Number(s.replace(",", ".")) || 0; };
const today = () => new Date().toLocaleDateString("en-CA", {timeZone: TZ});
const addDays = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const fDate = d => new Date(d + "T12:00:00Z").toLocaleDateString("id-ID", {weekday: "short", day: "numeric", month: "short", timeZone: "UTC"});
const fLong = d => new Date(d + "T12:00:00Z").toLocaleDateString("id-ID", {weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC"});
const fTime = t => new Date(t).toLocaleTimeString("id-ID", {hour: "2-digit", minute: "2-digit", timeZone: TZ});
const fDT = t => new Date(t).toLocaleString("id-ID", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: TZ});
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const errMsg = e => String(e?.message || e || "Terjadi kesalahan").replace(/^.*?ERROR:\s*/, "");
async function rpc(fn, args) { const {data, error} = await SB.rpc(fn, args); if (error) throw error; return data; }
async function q(p) { const {data, error} = await p; if (error) throw error; return data; }
function toast(msg, err) { const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 4800 : 2600); }
const logoSvg = (vb, cls) => `<svg class="${cls || ""}" viewBox="${vb}" aria-hidden="true"><use href="#bst"/></svg>`;
const LOGO_FULL = "0 0 2037 1753", LOGO_BST = "395 25 1200 470", LOGO_EMBLEM = "150 470 1750 1030";
const ROLE_LABEL = {owner: "Owner", manager: "Manager", kasir: "Kasir", dapur: "Dapur"};

function modal(html, wide) {
  $("#modalRoot").innerHTML = `<div class="scrim"><div class="modal${wide ? " wide" : ""}" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#modalRoot .scrim").addEventListener("click", e => { if (e.target.classList.contains("scrim")) closeModal(); });
  const m = $("#modalRoot .modal"); setTimeout(() => m.querySelector("input,select,textarea")?.focus(), 30); return m;
}
function closeModal() { $("#modalRoot").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
function confirmBox(title, body, ok, onOk, opts = {}) {
  const m = modal(`<h3>${esc(title)}</h3><p class="muted">${body}</p>
    ${opts.input ? `<label>${esc(opts.input)}<input id="cfIn"></label>` : ""}
    <div class="row" style="justify-content:flex-end"><button class="btn ghost fit" id="cfNo">Batal</button><button class="btn pri fit${opts.danger ? " danger" : ""}" id="cfOk">${esc(ok)}</button></div>`);
  m.querySelector("#cfNo").onclick = closeModal;
  m.querySelector("#cfOk").onclick = async () => { const v = opts.input ? m.querySelector("#cfIn").value : null; closeModal(); try { await onOk(v); } catch (e) { toast(errMsg(e), true); } };
}
async function busy(btn, fn) { if (btn) btn.disabled = true; try { return await fn(); } catch (e) { toast(errMsg(e), true); } finally { if (btn) btn.disabled = false; } }

/* ---------- state ---------- */
const S = { me: null, role: null, view: "beranda", menu: [], ing: [], settings: {}, staff: [], cart: {}, pay: "tunai", avail: {}, buy: [], ui: {} };
const isAdmin = () => ["owner", "manager"].includes(S.role);

/* ---------- navigation ---------- */
const IC = {
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  pos: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M7 20h10M12 16v4"/>',
  pot: '<path d="M4 10h16v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M2 10h20M9 6c0-1 1-1 1-2M14 6c0-1 1-1 1-2"/>',
  lock: '<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  cam: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  box: '<path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>',
  cart: '<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l3 12h12l2-8H7"/>',
  bag: '<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  spark: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'
};
const VIEWS = [
  {g: "Harian", k: "beranda", t: "Beranda", i: "home", roles: "*"},
  {g: "Harian", k: "kasir", t: "Kasir", i: "pos", roles: ["owner", "manager", "kasir"]},
  {g: "Harian", k: "prep", t: "Prep harian", i: "pot", roles: "*"},
  {g: "Harian", k: "closing", t: "Closing", i: "lock", roles: "*"},
  {g: "Harian", k: "absensi", t: "Absensi", i: "cam", roles: "*"},
  {g: "Gudang", k: "stok", t: "Stok bahan", i: "box", roles: "*"},
  {g: "Gudang", k: "order", t: "Order bahan", i: "cart", roles: "*"},
  {g: "Gudang", k: "pembelian", t: "Pembelian", i: "bag", roles: ["owner", "manager", "dapur"]},
  {g: "Owner", k: "laporan", t: "Keuangan", i: "chart", roles: ["owner", "manager"]},
  {g: "Owner", k: "analitik", t: "Analitik", i: "spark", roles: ["owner", "manager"]},
  {g: "Owner", k: "pengaturan", t: "Pengaturan", i: "gear", roles: ["owner", "manager"]}
];
const allowed = v => v.roles === "*" || v.roles.includes(S.role);
const navBtn = v => `<button class="nav" data-go="${v.k}"><svg viewBox="0 0 24 24">${IC[v.i]}</svg><span>${v.t}</span><span class="cnt" data-cnt="${v.k}" hidden></span></button>`;
IC.more = '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>';
const BOTTOM = {owner: ["beranda", "kasir", "prep", "closing"], manager: ["beranda", "kasir", "prep", "closing"], kasir: ["beranda", "kasir", "prep", "closing"], dapur: ["beranda", "prep", "stok", "order"]};
const initials = () => (S.me.full_name || "?").split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
function userSheet() {
  const m = modal(`<div style="display:flex;gap:.75rem;align-items:center"><span class="av" style="width:44px;height:44px">${esc(initials())}</span><div><b>${esc(S.me.full_name)}</b><div class="muted small">@${esc(S.me.username || "")} · ${esc(ROLE_LABEL[S.role])}</div></div></div>
    <div class="row" style="justify-content:flex-end"><button class="btn fit" id="uNo">Tutup</button><button class="btn pri fit" id="uOut">Keluar</button></div>`);
  m.querySelector("#uNo").onclick = closeModal; m.querySelector("#uOut").onclick = async () => { await SB.auth.signOut(); location.reload(); };
}
function moreSheet() {
  const vs = VIEWS.filter(allowed);
  const m = modal(`<div class="head"><h3>Semua menu</h3><button class="btn sm fit" id="mNo">Tutup</button></div>
    <div class="sheet">${vs.map(v => `<button data-sg="${v.k}" ${v.k === S.view ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24">${IC[v.i]}</svg>${v.t}</button>`).join("")}</div>
    <button class="me" id="mMe"><span class="av">${esc(initials())}</span><div><b>${esc(S.me.full_name)}</b><small>${esc(ROLE_LABEL[S.role])} · ketuk untuk keluar</small></div></button>`);
  m.querySelector("#mNo").onclick = closeModal;
  m.querySelectorAll("[data-sg]").forEach(b => b.onclick = () => { closeModal(); go(b.dataset.sg); });
  m.querySelector("#mMe").onclick = userSheet;
}
function renderShell() {
  const vs = VIEWS.filter(allowed), groups = [...new Set(vs.map(v => v.g))];
  const bot = (BOTTOM[S.role] || BOTTOM.kasir).map(k => VIEWS.find(v => v.k === k)).filter(v => v && allowed(v));
  const brand = `<div class="brand"><span class="tile">${logoSvg(LOGO_BST)}</span><div><b class="outletName">${esc(S.settings.outlet?.name || "Bubur Simpang Tiga")}</b><span class="status">Buka hari ini</span></div></div>`;
  $("#root").innerHTML = `<div class="app">
    <aside class="side">${brand}
      <nav class="navlist" aria-label="Menu">${groups.map(g => `<div class="grp"><div class="grp-t">${g}</div>${vs.filter(v => v.g === g).map(navBtn).join("")}</div>`).join("")}</nav>
      <button class="me" id="meBtn"><span class="av">${esc(initials())}</span><div><b>${esc(S.me.full_name)}</b><small>${esc(ROLE_LABEL[S.role])}</small></div></button>
    </aside>
    <div class="mainwrap">
      <header class="top"><div class="top-in">
        ${brand}
        <div class="crumb"><small id="crumbG"></small><b id="crumbT"></b></div>
        <div class="top-right">
          <span class="chip datechip"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="clock"></span></span>
          <button class="btn iconbtn" id="refresh" aria-label="Muat ulang data" title="Muat ulang data"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
          <button class="topuser" id="topUser" aria-label="Akun"><span class="av">${esc(initials())}</span></button>
        </div>
      </div></header>
      <main><section class="view" id="view"></section></main>
    </div>
    <nav class="bottom" aria-label="Menu cepat">${bot.map(v => `<button data-go="${v.k}"><svg viewBox="0 0 24 24">${IC[v.i]}</svg>${v.t.split(" ")[0]}<span class="cnt" data-cnt="${v.k}" hidden></span></button>`).join("")}<button id="moreBtn"><svg viewBox="0 0 24 24">${IC.more}</svg>Lainnya</button></nav>
  </div>`;
  $$("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  $("#refresh").onclick = async () => { await loadMaster(); go(S.view); refreshBadges(); };
  $("#meBtn").onclick = userSheet; $("#topUser").onclick = userSheet; $("#moreBtn").onclick = moreSheet;
  const tick = () => { const c = $("#clock"); if (c) c.textContent = new Date().toLocaleString("id-ID", {weekday: "long", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: TZ}); };
  tick(); clearInterval(S.clockT); S.clockT = setInterval(tick, 30000);
}
async function go(k) {
  const v = VIEWS.find(x => x.k === k && allowed(x)) || VIEWS[0];
  S.view = v.k; lsSet("bst_view", v.k);
  $$("[data-go]").forEach(b => b.dataset.go === v.k ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  { const h = Number(new Date().toLocaleString("en-GB", {hour: "2-digit", hour12: false, timeZone: TZ})); const g = $("#crumbT"); if (g) { g.textContent = (h < 11 ? "Selamat pagi" : h < 15 ? "Selamat siang" : h < 18 ? "Selamat sore" : "Selamat malam") + ", " + (S.me.full_name || "").split(" ")[0]; $("#crumbG").textContent = v.g + " · " + v.t; } }
  const el = $("#view"); el.innerHTML = `<p class="muted">Memuat…</p>`;
  try { await RENDER[v.k](el); } catch (e) { console.error(e); el.innerHTML = `<div class="empty"><b>Halaman ini gagal dimuat</b><span>${esc(errMsg(e))}</span><button class="btn sm" id="retry">Coba lagi</button></div>`; $("#retry").onclick = () => go(k); }
  window.scrollTo({top: 0});
}

/* ---------- data ---------- */
async function loadMaster() {
  const [m, i, st] = await Promise.all([
    q(SB.from("menu_items").select("*").order("sort").order("id")),
    q(SB.from("ingredients").select("*").order("name")),
    q(SB.from("settings").select("*"))
  ]);
  S.menu = m; S.ing = i; S.settings = Object.fromEntries(st.map(x => [x.key, x.value]));
}
async function loadStaff() { try { S.staff = await rpc("staff_names"); } catch (e) { S.staff = []; } }
const staffName = id => S.staff.find(s => s.id === id)?.full_name || "—";
const ingById = id => S.ing.find(i => i.id === id);
const baseItem = () => S.menu.find(m => m.kind === "base" && m.active);
const sellable = () => S.menu.filter(m => m.kind !== "base" && m.active && m.category !== "Arsip");
async function dayData(date) {
  const [prep, sales] = await Promise.all([
    q(SB.from("daily_prep").select("*").eq("prep_date", date)),
    q(SB.from("sales").select("*, sale_items(*)").eq("sale_date", date).order("created_at", {ascending: false}))
  ]);
  const sold = {};
  let bowls = 0;
  sales.filter(x => x.status === "paid").forEach(x => x.sale_items.forEach(i => { sold[i.menu_item_id] = (sold[i.menu_item_id] || 0) + i.qty; if (S.menu.find(m => m.id === i.menu_item_id)?.uses_base) bowls += i.qty; }));
  const b = baseItem(); if (b) sold[b.id] = bowls;
  return {prep, sales, sold, bowls};
}

/* ---------- AUTH ---------- */
async function renderAuth() {
  let has = true;
  try { const {data, error} = await SB.rpc("has_accounts"); if (!error) has = !!data; } catch (e) {}
  const last = lsGet("bst_user") || "";
  $("#root").innerHTML = `<div class="auth"><div class="auth-card">
    ${logoSvg(LOGO_FULL, "logo-full")}
    ${has ? `
    <form class="panel" id="loginForm" autocomplete="on">
      <div><div class="eyebrow">BST OS</div><h2>Masuk</h2></div>
      <label>Username<input name="username" id="lgUser" autocapitalize="none" autocomplete="username" required value="${esc(last)}"></label>
      <label>PIN 6 angka<input name="pin" id="lgPin" class="pin" type="password" inputmode="numeric" pattern="\\d{6}" maxlength="6" autocomplete="current-password" required></label>
      <button class="btn pri block" type="submit">Masuk</button>
      <p class="muted small">Belum punya akun? Minta Owner atau Manager membuatkannya di Pengaturan → Staf.</p>
    </form>` : `
    <form class="panel" id="setupForm">
      <div><div class="eyebrow">Pertama kali</div><h2>Buat akun Owner</h2></div>
      <p class="muted small">Belum ada akun di BST OS. Akun ini menjadi Owner dan bisa menambahkan staf lain.</p>
      <label>Nama<input name="name" required maxlength="40" autocomplete="name"></label>
      <label>Username<input name="username" required pattern="[a-z0-9._-]{3,24}" autocapitalize="none" placeholder="huruf kecil, mis. adi"></label>
      <label>PIN 6 angka<input name="pin" class="pin" type="password" inputmode="numeric" pattern="\\d{6}" maxlength="6" required autocomplete="new-password"></label>
      <label>Ulangi PIN<input name="pin2" class="pin" type="password" inputmode="numeric" pattern="\\d{6}" maxlength="6" required autocomplete="new-password"></label>
      <button class="btn pri block" type="submit">Buat akun & masuk</button>
    </form>`}
  </div></div>`;
  if (has) { if (last) $("#lgPin").focus(); }
  $("#loginForm")?.addEventListener("submit", async e => {
    e.preventDefault(); const f = e.target, u = f.username.value.trim().toLowerCase(), pin = f.pin.value;
    await busy(f.querySelector("button"), async () => {
      const {data, error} = await SB.auth.signInWithPassword({email: u + "@" + EMAIL_DOMAIN, password: pinPass(pin)});
      if (error) { f.pin.value = ""; f.pin.focus(); throw new Error(/banned/i.test(error.message) ? "Akun ini dinonaktifkan." : /rate|many/i.test(error.message) ? "Terlalu banyak percobaan. Tunggu sebentar." : "Username atau PIN salah."); }
      lsSet("bst_user", u); await start(data.session);
    });
  });
  $("#setupForm")?.addEventListener("submit", async e => {
    e.preventDefault(); const f = e.target, u = f.username.value.trim().toLowerCase(), pin = f.pin.value;
    if (pin !== f.pin2.value) return toast("PIN tidak sama.", true);
    await busy(f.querySelector("button"), async () => {
      const {data, error} = await SB.functions.invoke("admin-staff", {body: {action: "bootstrap", name: f.name.value.trim(), username: u, pin}});
      if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch (x) {} throw new Error(m); }
      if (data?.error) throw new Error(data.error);
      const r = await SB.auth.signInWithPassword({email: u + "@" + EMAIL_DOMAIN, password: pinPass(pin)});
      if (r.error) throw new Error("Akun dibuat, tapi gagal masuk. Coba masuk manual.");
      lsSet("bst_user", u); await start(r.data.session);
    });
  });
}
async function callFn(name, body) {
  const {data, error} = await SB.functions.invoke(name, {body});
  if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch (x) {} throw new Error(m); }
  if (data?.error) throw new Error(data.error);
  return data;
}
async function start(session) {
  const me = await q(SB.from("profiles").select("*").eq("id", session.user.id).maybeSingle());
  if (!me || !me.active) { await SB.auth.signOut(); toast("Akun belum aktif. Hubungi Owner.", true); return renderAuth(); }
  S.me = me; S.role = me.staff_role;
  await Promise.all([loadMaster(), loadStaff()]);
  try { await rpc("open_day", {p_date: today()}); } catch (e) {}
  renderShell();
  const saved = lsGet("bst_view");
  await go(saved && VIEWS.some(v => v.k === saved && allowed(v)) ? saved : (S.role === "kasir" ? "kasir" : "beranda"));
  refreshBadges();
}
async function refreshBadges() {
  try {
    const low = S.ing.filter(i => i.active && Number(i.stock_qty) <= Number(i.min_stock) && Number(i.min_stock) > 0).length;
    const ords = await q(SB.from("orders").select("id", {count: "exact", head: false}).in("status", ["draft", "dipesan"]));

async function shrink(file, max) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, "image/jpeg", .82));
}

/* ================= RANGE PICKER ================= */
function rangeOf(p) {
  const t = today(); let s = t, e = t;
  if (p === "7") s = addDays(t, -6); if (p === "30") s = addDays(t, -29);
  if (p === "month") s = t.slice(0, 8) + "01";
  if (p === "lastmonth") { e = addDays(t.slice(0, 8) + "01", -1); s = e.slice(0, 8) + "01"; }
  return [s, e];
}
function rangeBar(key, onChange) {
  const r = S.ui[key] ||= {p: "month", s: rangeOf("month")[0], e: rangeOf("month")[1]};
  const html = `<div class="row" style="flex:0 1 560px"><select id="${key}P">${[["today", "Hari ini"], ["7", "7 hari terakhir"], ["30", "30 hari terakhir"], ["month", "Bulan ini"], ["lastmonth", "Bulan lalu"], ["custom", "Pilih tanggal"]].map(([v, l]) => `<option value="${v}" ${r.p === v ? "selected" : ""}>${l}</option>`).join("")}</select><input type="date" id="${key}S" value="${r.s}"><input type="date" id="${key}E" value="${r.e}"></div>`;
  const bind = () => {
    $(`#${key}P`).onchange = e => { r.p = e.target.value; if (r.p !== "custom") [r.s, r.e] = rangeOf(r.p); onChange(); };
    $(`#${key}S`).onchange = e => { r.p = "custom"; r.s = e.target.value; onChange(); };
    $(`#${key}E`).onchange = e => { r.p = "custom"; r.e = e.target.value; onChange(); };
  };
  return {html, bind, r};
}
function daysBetween(s, e) { const out = []; for (let d = s; d <= e && out.length < 92; d = addDays(d, 1)) out.push(d); return out; }

async function vAnalitik(el) {
  const rb = rangeBar("ana", () => vAnalitik(el)); const {s, e} = rb.r;
  const [a, r] = await Promise.all([rpc("get_analytics", {p_start: s, p_end: e}), rpc("get_report", {p_start: s, p_end: e})]);
  const hours = Array.from({length: 24}, (_, h) => a.by_hour.find(x => x.h === h) || {h, trx: 0, omzet: 0});
  const firstH = Math.min(...a.by_hour.map(x => x.h), 6), lastH = Math.max(...a.by_hour.map(x => x.h), 14);
  const hs = hours.slice(firstH, lastH + 1), hmax = Math.max(1, ...hs.map(x => x.trx));
  const DOW = ["", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu", "Minggu"];
  const dows = [1, 2, 3, 4, 5, 6, 7].map(d => a.by_dow.find(x => x.dow === d) || {dow: d, omzet: 0, days: 0, porsi: 0});
  const davg = dows.map(d => d.days ? d.omzet / d.days : 0), dmax = Math.max(1, ...davg);
  const umax = Math.max(1, ...a.usage.map(u => u.value));
  const prepTot = a.prep.reduce((x, p) => x + p.prepared, 0), wasteTot = a.prep.reduce((x, p) => x + p.waste, 0);
  const days = daysBetween(s, e), daily = Object.fromEntries((r.daily || []).map(x => [x.date, x]));
  const fcDays = days.filter(d => daily[d]).map(d => ({d, fc: daily[d].omzet ? daily[d].hpp / daily[d].omzet * 100 : 0}));
  const fcMax = Math.max(50, ...fcDays.map(x => x.fc)), tgt = Number(S.settings.targets?.food_cost || 35);
  const peak = hs.reduce((b, x) => x.trx > b.trx ? x : b, {trx: 0});
  el.innerHTML = `<div class="head"><div><div class="eyebrow">Owner</div><h2>Analitik</h2></div>${rb.html}</div>
    <div class="kpis">
      <div class="kpi lead"><span class="eyebrow">Rata-rata per transaksi</span><b>${rp(a.ticket)}</b><span class="small">${r.trx} transaksi</span></div>
      <div class="kpi"><span class="eyebrow">Jam tersibuk</span><b>${peak.trx ? String(peak.h).padStart(2, "0") + ".00" : "—"}</b><span class="small">${peak.trx} transaksi</span></div>
      <div class="kpi"><span class="eyebrow">Waste porsi</span><b>${prepTot ? (wasteTot / prepTot * 100).toFixed(1) + "%" : "—"}</b><span class="small">${wasteTot} dari ${prepTot} porsi tersedia</span></div>
      <div class="kpi"><span class="eyebrow">Bahan terpakai</span><b>${rp(a.usage.reduce((x, u) => x + Number(u.value), 0))}</b><span class="small">dari prep</span></div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>Transaksi per jam</h3><div class="bars">${hs.map(x => `<div class="bar${x.trx ? "" : " dim"}" style="height:${Math.max(1.5, x.trx / hmax * 100)}%" data-tip="${String(x.h).padStart(2, "0")}.00: ${x.trx} trx · ${rp(x.omzet)}"></div>`).join("")}</div>
        <div class="axis"><span>${String(firstH).padStart(2, "0")}.00</span><span>${String(lastH).padStart(2, "0")}.00</span></div></div>
      <div class="panel"><h3>Rata-rata omzet per hari</h3>${dows.map((d, i) => `<div class="hbar"><span>${DOW[d.dow]}</span><span class="tr"><i style="width:${davg[i] / dmax * 100}%"></i></span><span class="num small">${rp(davg[i])}</span></div>`).join("")}</div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>Food cost harian <span class="muted small" style="font-family:var(--f-body)">· garis = target ${tgt}%</span></h3>
        ${fcDays.length ? `<div class="bars" style="position:relative">${fcDays.map(x => `<div class="bar" style="height:${Math.max(1.5, x.fc / fcMax * 100)}%;${x.fc > tgt ? "background:var(--bad)" : ""}" data-tip="${fDate(x.d)}: ${x.fc.toFixed(1)}%"></div>`).join("")}<div style="position:absolute;left:0;right:0;bottom:${tgt / fcMax * 100}%;border-top:1.5px dashed var(--muted)"></div></div>
        <div class="axis"><span>${fDate(fcDays[0].d)}</span><span>${fDate(fcDays[fcDays.length - 1].d)}</span></div>` : `<p class="muted">Belum ada penjualan.</p>`}</div>
      <div class="panel"><h3>Pemakaian bahan baku</h3>${a.usage.length ? a.usage.slice(0, 12).map(u => `<div class="hbar"><span>${esc(u.name)}</span><span class="tr"><i style="width:${u.value / umax * 100}%"></i></span><span class="num small">${num(u.qty)} ${esc(u.unit)} · ${rp(u.value)}</span></div>`).join("") : `<p class="muted">Belum ada prep yang memotong bahan. Isi resep dulu di Pengaturan.</p>`}</div>
    </div>
    <div class="panel"><h3>Prep, waste, dan simpan per hari</h3>${a.prep.length ? `<div class="tbl"><table><thead><tr><th>Tanggal</th><th class="num">Tersedia</th><th class="num">Waste</th><th class="num">Disimpan</th><th class="num">Waste %</th></tr></thead><tbody>
      ${a.prep.slice().reverse().map(p => `<tr><td>${fDate(p.date)}</td><td class="num">${p.prepared}</td><td class="num">${p.waste}</td><td class="num">${p.carry}</td><td class="num"><span class="pill ${!p.prepared ? "idle" : p.waste / p.prepared > .1 ? "bad" : p.waste / p.prepared > .05 ? "warn" : "ok"}">${p.prepared ? (p.waste / p.prepared * 100).toFixed(1) : 0}%</span></td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">Belum ada data prep.</p>`}</div>`;
  rb.bind();
}

    const lines = await q(SB.from("recipe_lines").select("*").eq("menu_item_id", mid));
    const price = Number(S.menu.find(m => m.id === mid)?.price || 0); let tot = 0;
    const rows = lines.map(r => { const i = ingById(r.ingredient_id), c = r.qty_per_portion * (i?.cost_per_unit || 0); tot += c; return `<tr><td>${esc(i?.name)}</td><td class="num">${num(r.qty_per_portion, 4)} ${esc(i?.unit)}</td><td class="num">${rp(c)}</td><td class="num"><button class="btn danger sm" data-rd="${r.id}" aria-label="Hapus">×</button></td></tr>`; }).join("");
    const mi = S.menu.find(m => m.id === mid), full = Number(await rpc("portion_cost", {p_menu: mid})), baseC = full - tot;
    const tgt = Number(S.settings.targets?.food_cost || 35), fc = price ? full / price * 100 : 0;
    $("#rcT").innerHTML = rows || (mi?.uses_base && baseC > 0) ? `<table><thead><tr><th>Bahan</th><th class="num">Per porsi</th><th class="num">Biaya</th><th></th></tr></thead><tbody>${rows}
      ${mi?.uses_base && baseC > 0 ? `<tr><td class="muted">Bubur dasar dari panci (1 mangkuk)</td><td></td><td class="num">${rp(baseC)}</td><td></td></tr>` : ""}
      <tr><td><b>${mi?.kind === "base" ? "Biaya bahan dasar per mangkuk" : "HPP per porsi"}</b></td><td></td><td class="num"><b>${rp(full)}</b></td><td class="num">${price ? `<span class="pill ${fc <= tgt ? "ok" : "bad"}">${fc.toFixed(1)}%</span>` : ""}</td></tr></tbody></table>`
      : `<div class="empty">Resep menu ini belum diisi. Tambahkan bahan dan takaran per porsi sesuai COGS.</div>`;
    $$("[data-rd]").forEach(b => b.onclick = () => busy(b, async () => { await q(SB.from("recipe_lines").delete().eq("id", +b.dataset.rd)); re(); }));
    $("#rcAdd").onclick = e => { const n = pd($("#rcQ").value); if (!(n > 0) || !$("#rcI").value) return toast("Pilih bahan dan isi takaran.", true);
      busy(e.target, async () => { await q(SB.from("recipe_lines").upsert({menu_item_id: mid, ingredient_id: +$("#rcI").value, qty_per_portion: n}, {onConflict: "menu_item_id,ingredient_id"})); re(); }); };
  },
  async staf(box, re) {
    const list = await q(SB.from("profiles").select("*").order("created_at"));
    box.innerHTML = `<div class="panel stack"><div class="head"><h3 style="margin:0">Staf</h3><button class="btn pri fit" id="sfNew">Tambah staf</button></div>
      <div class="tbl"><table><thead><tr><th>Nama</th><th>Username</th><th>Peran</th><th>Status</th><th></th></tr></thead><tbody>
      ${list.map(u => `<tr><td><b>${esc(u.full_name)}</b></td><td>${esc(u.username || "")}</td><td>${esc(ROLE_LABEL[u.staff_role] || u.staff_role)}</td><td><span class="pill ${u.active ? "ok" : "idle"}">${u.active ? "Aktif" : "Nonaktif"}</span></td><td class="num"><button class="btn ghost sm" data-sf="${u.id}">Ubah</button></td></tr>`).join("")}</tbody></table></div>
      <div class="panel" style="background:var(--paper)"><b>Akses per peran</b><ul class="small muted" style="margin:.4rem 0 0;padding-left:1.1rem;display:grid;gap:.2rem">
        <li><b>Owner / Manager</b>: semua menu, termasuk keuangan, analitik, pengaturan, opname, dan pembatalan transaksi.</li>
        <li><b>Kasir</b>: kasir, prep, closing kas & checklist, absensi, stok, order bahan.</li>
        <li><b>Dapur</b>: prep, checklist, absensi, stok & waste, order dan pembelian bahan.</li></ul></div></div>`;
    const form = u => { const m = modal(`<h3>${u ? "Ubah staf" : "Tambah staf"}</h3>
      <label>Nama<input id="sN" value="${esc(u?.full_name || "")}" maxlength="40"></label>
      <label>Username<input id="sU" value="${esc(u?.username || "")}" autocapitalize="none" placeholder="huruf kecil, mis. rina"></label>
      <label>Peran<select id="sR">${["kasir", "dapur", "manager", "owner"].filter(r => r !== "owner" || S.role === "owner").map(r => `<option value="${r}" ${u?.staff_role === r ? "selected" : ""}>${ROLE_LABEL[r]}</option>`).join("")}</select></label>
      <label>${u ? "PIN baru (kosongkan bila tidak diganti)" : "PIN 6 angka"}<input id="sP" class="pin" inputmode="numeric" maxlength="6" autocomplete="off"></label>
      ${u ? `<label style="display:flex;gap:.5rem;align-items:center;color:var(--text)"><input type="checkbox" id="sA" ${u.active ? "checked" : ""} style="width:auto"> Akun aktif</label>` : ""}
      <div class="row" style="justify-content:flex-end"><button class="btn ghost fit" id="sNo">Batal</button><button class="btn pri fit" id="sOk">Simpan</button></div>`);
      m.querySelector("#sNo").onclick = closeModal;
      m.querySelector("#sOk").onclick = e => busy(e.target, async () => { const pin = m.querySelector("#sP").value.trim();
        await callFn("admin-staff", {action: "save", id: u?.id || "", name: m.querySelector("#sN").value.trim(), username: m.querySelector("#sU").value.trim().toLowerCase(), role: m.querySelector("#sR").value, pin, active: u ? m.querySelector("#sA").checked : true});
        closeModal(); toast("Data staf tersimpan." + (pin ? " Beri tahu PIN-nya langsung ke staf." : "")); await loadStaff(); re(); }); };
    $("#sfNew").onclick = () => form(null);
    $$("[data-sf]").forEach(b => b.onclick = () => form(list.find(u => u.id === b.dataset.sf)));
  },
  async cadangan(box) {
    box.innerHTML = `<div class="panel stack"><h3 style="margin:0">Unduh cadangan data</h3><p class="muted">Simpan salinan semua data (menu, bahan, resep, penjualan, prep, stok, pembelian, order, closing, absensi, biaya) sebagai file JSON. Lakukan seminggu sekali; paket gratis Supabase tidak menyimpan riwayat pemulihan.</p>
      <button class="btn pri fit" id="bk" style="justify-self:start">Unduh cadangan</button><p class="muted small">Jangan unggah file cadangan ke GitHub karena repo ini publik.</p></div>`;
    $("#bk").onclick = e => busy(e.target, async () => {
      const T = ["settings", "menu_items", "ingredients", "recipe_lines", "daily_prep", "sales", "sale_items", "purchases", "purchase_items", "stock_movements", "orders", "cash_closings", "checklist_runs", "attendance", "expenses"], out = {};
      for (const t of T) { out[t] = []; for (let f = 0; ; f += 1000) { const rows = await q(SB.from(t).select("*").range(f, f + 999)); out[t].push(...rows); if (rows.length < 1000) break; } }
      const blob = new Blob([JSON.stringify({app: "bst-os", exportedAt: new Date().toISOString(), tables: out}, null, 1)], {type: "application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `bst-os-cadangan-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
      toast("Cadangan diunduh."); });
  }
};

const RENDER = {beranda: vBeranda, kasir: vKasir, prep: vPrep, closing: vClosing, absensi: vAbsensi, stok: vStok, order: vOrder, pembelian: vPembelian, laporan: vLaporan, analitik: vAnalitik, pengaturan: vPengaturan};

/* ---------- boot ---------- */
async function boot() {
  if (!CFG.url) { $("#root").innerHTML = `<div class="auth"><div class="empty">config.js tidak ditemukan.</div></div>`; return; }
  const {data: {session}} = await SB.auth.getSession();
  if (session) { try { await start(session); return; } catch (e) { console.error(e); } }
  renderAuth();
}
boot();

const BUILD = "{{BUILD}}";
async function checkUpdate() { try { const t = await (await fetch(location.pathname + "?u=" + Date.now(), {cache: "no-store"})).text(); if (t.includes('const BUILD = "') && !t.includes('const BUILD = "' + BUILD + '"')) showUpdate(); } catch (e) {} }
function showUpdate() { if ($("#upd")) return; const d = document.createElement("div"); d.id = "upd"; d.className = "upd"; d.setAttribute("role", "status"); d.innerHTML = '<span>Versi baru BST OS tersedia</span><button class="btn sm">Muat ulang</button>'; d.querySelector("button").onclick = () => location.reload(); document.body.appendChild(d); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
setInterval(checkUpdate, 5 * 60 * 1000);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
